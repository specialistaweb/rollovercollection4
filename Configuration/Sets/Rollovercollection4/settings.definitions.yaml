settings:

  plugin.tx_rollovercollection4_rollovereffect4.view.scssPath:
    label: 'Path to the SCSS folder'
    description: 'Folder containing theme.scss, with trailing slash. Change it only to use your own copy of the theme.'
    category: Rollovercollection4.general
    type: string
    default: 'EXT:rollovercollection4/Resources/Public/Scss/Theme/'

  plugin.tx_rollovercollection4_rollovereffect4.settings.titleRawdataOutput:
    label: 'Title: keep HTML typed by editors'
    description: 'On: HTML in the image title is kept and cleaned by the TYPO3 HTML sanitizer. Off: plain text only.'
    category: Rollovercollection4.general
    type: bool
    default: false

  plugin.tx_rollovercollection4_rollovereffect4.settings.captionRawdataOutput:
    label: 'Caption: keep HTML typed by editors'
    description: 'On: HTML in the image description is kept and cleaned by the TYPO3 HTML sanitizer. Off: plain text only.'
    category: Rollovercollection4.general
    type: bool
    default: true

  plugin.tx_rollovercollection4_rollovereffect4.settings.imageMaxWidth:
    label: 'Maximum image width (px)'
    description: 'Images wider than this are scaled down before delivery. 0 = deliver the original file.'
    category: Rollovercollection4.general
    type: int
    default: 1600

