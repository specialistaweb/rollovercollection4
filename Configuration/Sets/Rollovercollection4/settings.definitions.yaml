# Rollovercollection 4 - BLOCKS: site settings (Site Management > Settings).
# Every setting is also available as TypoScript constant with the same key.
# Keep the defaults in sync with Configuration/TypoScript/constants.typoscript.
categories:
  Rollovercollection4:
    label: 'Rollovercollection 4 - BLOCKS'
  Rollovercollection4.general:
    label: 'General'
    parent: Rollovercollection4
  Rollovercollection4.common:
